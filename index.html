<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📚 대현고등학교 독서 인증 시스템</title>
  
  <!-- Global Google Identity Services Callback Definition (must be defined BEFORE gsi/client loads) -->
  <script>
    window.handleGoogleCredentialResponse = function(response) {
      if (!response || !response.credential) return;
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        const payload = JSON.parse(jsonPayload);
        if (payload && payload.email) {
          const alpineApp = document.querySelector('[x-data]')?.__x?.$data;
          if (alpineApp) {
            alpineApp.googleForm.email = payload.email;
            alpineApp.googleForm.name = payload.name || payload.email.split('@')[0];
            alpineApp.openGoogleModal = true;
          }
        }
      } catch (err) {
        console.warn("Google Auth Response Parsing Notice:", err);
      }
    };

    window.initGoogleClient = function() {
      try {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.initialize({
            client_id: "475801120252-ee3s47hd2rukvko4pcia6os368kujpto.apps.googleusercontent.com",
            callback: window.handleGoogleCredentialResponse,
            auto_select: false,
            itp_support: true
          });
        }
      } catch (e) {
        console.warn("Google GIS Client setup notice:", e);
      }
    };
  </script>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleClient()" onerror="console.warn('Google GIS SDK failed to load')"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js for reactive UI -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between" x-data="readingApp()">

  <!-- Header Bar -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
          <i class="fa-solid fa-book-open text-xl text-yellow-300"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">대현고 독서 인증</h1>
          <p class="text-xs text-indigo-200">대현고등학교 독서 기록장</p>
        </div>
      </div>

      <!-- User Badge & Actions -->
      <template x-if="nickname">
        <div class="flex items-center space-x-2">
          <div class="bg-indigo-700/80 px-3 py-1.5 rounded-full border border-indigo-400/40 text-xs flex items-center space-x-2">
            <template x-if="userEmail">
              <i class="fa-brands fa-google text-emerald-300"></i>
            </template>
            <template x-if="!userEmail">
              <i class="fa-solid fa-user-circle text-yellow-300"></i>
            </template>
            <span class="font-semibold" x-text="nickname"></span>
            <span class="bg-yellow-400 text-indigo-950 font-extrabold px-1.5 py-0.5 rounded-full text-[10px]" x-text="getUserReadingDays(nickname) + '일째'"></span>
          </div>
          <button @click="logout()" title="로그아웃" class="text-indigo-200 hover:text-white p-1.5 rounded-lg hover:bg-indigo-700 transition">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </template>
    </div>
  </header>

  <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow">

    <!-- 1. LOGIN / NICKNAME ENTRY SCREEN -->
    <template x-if="!nickname">
      <div class="my-6 bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 text-center max-w-md mx-auto">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-1">대현고 독서 인증 📚</h2>
        <p class="text-slate-500 text-xs sm:text-sm mb-6">학교 구글 계정이나 학번/이름으로 로그인하여 독서 일지를 기록해 보세요.</p>

        <!-- Google School Account Login Button -->
        <div class="space-y-3 mb-6">
          <button @click="openGoogleModal = true" type="button" 
                  class="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold py-3.5 px-4 rounded-2xl border-2 border-slate-200 shadow-sm transition flex items-center justify-center space-x-3 group hover:border-indigo-500">
            <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="text-sm">학교 구글 계정(@daehyun.hs.kr) 로그인</span>
          </button>
        </div>

        <div id="g_id_onload"
             data-client_id="475801120252-ee3s47hd2rukvko4pcia6os368kujpto.apps.googleusercontent.com"
             data-auto_prompt="false"
             data-callback="handleGoogleCredentialResponse"
             class="hidden">
        </div>

        <form @submit.prevent="login()" class="space-y-4">
          <div>
            <label class="block text-left text-xs font-semibold text-slate-600 mb-1 ml-1">학생 닉네임 / 학번 이름</label>
            <input type="text" x-model="inputNickname" required placeholder="예: 20101 홍길동" 
                   class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm">
          </div>

          <div>
            <label class="block text-left text-xs font-semibold text-slate-600 mb-1 ml-1">비밀번호 (PIN 4자리)</label>
            <input type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" x-model="inputPin" required placeholder="숫자 4자리 (예: 1234)" 
                   class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm text-center tracking-widest font-bold">
          </div>

          <template x-if="loginError">
            <div class="text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-xl font-medium" x-text="loginError"></div>
          </template>

          <button type="submit" 
                  class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 active:scale-[0.99] transition flex items-center justify-center space-x-2">
            <span>독서 시작하기</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
          <span>📚 대현고등학교 독서 프로젝트</span>
          <button @click="openGasModal = true" class="text-indigo-500 hover:underline flex items-center">
            <i class="fa-solid fa-gear me-1"></i> GAS 연동
          </button>
        </div>
      </div>
    </template>

    <!-- 2. MAIN DASHBOARD & TABS (When Logged In) -->
    <template x-if="nickname">
      <div class="space-y-6">

        <!-- Banner Summary Card -->
        <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-indigo-500/20 text-9xl pointer-events-none">
            <i class="fa-solid fa-book"></i>
          </div>
          
          <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="inline-block bg-indigo-500/50 text-indigo-100 text-xs px-2.5 py-0.5 rounded-full mb-1">
                오늘도 즐거운 독서 시간 📖
              </span>
              <h2 class="text-xl font-extrabold flex items-center gap-2">
                <span x-text="nickname"></span> 학생의 독서함
              </h2>
            </div>

            <!-- Stats -->
            <div class="flex items-center gap-3 bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
              <div class="text-center px-3 border-r border-white/20">
                <div class="text-xs text-indigo-200">총 독서 일수</div>
                <div class="text-xl font-black text-yellow-300" x-text="getUserReadingDays(nickname) + '일'"></div>
              </div>
              <div class="text-center px-3 border-r border-white/20">
                <div class="text-xs text-indigo-200">등록 도서</div>
                <div class="text-xl font-black text-white" x-text="getUserBooks(nickname).length + '권'"></div>
              </div>
              <div class="text-center px-3">
                <div class="text-xs text-indigo-200">활동 기록</div>
                <div class="text-xl font-black text-emerald-300" x-text="getUserLogs(nickname).length + '개'"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab Navigation Buttons -->
        <div class="flex bg-slate-200/80 p-1 rounded-2xl text-slate-600 font-medium text-sm">
          <button @click="currentTab = 'records'" 
                  :class="currentTab === 'records' ? 'bg-white text-indigo-700 shadow-md font-bold' : 'hover:text-slate-900'"
                  class="flex-1 py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-book-journal-whills"></i>
            <span>내 독서 기록</span>
          </button>
          <button @click="currentTab = 'ranking'" 
                  :class="currentTab === 'ranking' ? 'bg-white text-indigo-700 shadow-md font-bold' : 'hover:text-slate-900'"
                  class="flex-1 py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-trophy text-amber-500"></i>
            <span>독서 순위</span>
          </button>
        </div>

        <!-- TAB 1: 내 독서 기록 -->
        <div x-show="currentTab === 'records'" class="space-y-5">
          
          <!-- Book Selector & Controls -->
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <div class="flex-grow">
              <label class="block text-xs font-semibold text-slate-500 mb-1">독서 중인 도서 선택</label>
              <select x-model="selectedBookTitle" 
                      class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <template x-if="getUserBooks(nickname).length === 0">
                  <option value="">등록된 도서가 없습니다. 새 도서를 추가해주세요.</option>
                </template>
                <template x-for="book in getUserBooks(nickname)" :key="book">
                  <option :value="book" x-text="book"></option>
                </template>
              </select>
            </div>

            <div class="flex items-center gap-2 pt-1 sm:pt-4">
              <button @click="openNewBookModal = true" 
                      class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-2.5 rounded-xl transition flex items-center whitespace-nowrap border border-indigo-200">
                <i class="fa-solid fa-plus me-1.5"></i> 새 도서 추가
              </button>
              
              <button @click="openLogModal()" 
                      :disabled="!selectedBookTitle"
                      :class="!selectedBookTitle ? 'bg-slate-300 cursor-not-allowed text-slate-500' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200'"
                      class="flex-1 sm:flex-none text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center justify-center whitespace-nowrap">
                <i class="fa-solid fa-pen-to-square me-1.5"></i> 활동 기록 쓰기
              </button>
            </div>
          </div>

          <!-- Active Selected Book Card & Feed -->
          <template x-if="selectedBookTitle">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
              <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                <div>
                  <span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">현재 선택된 도서</span>
                  <h3 class="text-lg font-bold text-slate-800 mt-1" x-text="selectedBookTitle"></h3>
                </div>
                <div class="text-right">
                  <span class="text-xs text-slate-400">누적 활동</span>
                  <div class="text-base font-bold text-indigo-600" x-text="getUserLogs(nickname, selectedBookTitle).length + '회'"></div>
                </div>
              </div>

              <div class="space-y-4">
                <template x-if="getUserLogs(nickname, selectedBookTitle).length === 0">
                  <div class="text-center py-8 text-slate-400">
                    <i class="fa-regular fa-file-lines text-4xl mb-2 text-slate-300"></i>
                    <p class="text-sm">아직 기록된 독서 활동이 없습니다.</p>
                    <p class="text-xs text-slate-400 mt-1">상단의 '활동 기록 쓰기' 버튼을 눌러 첫 인증을 남겨보세요!</p>
                  </div>
                </template>

                <template x-for="log in getUserLogs(nickname, selectedBookTitle)" :key="log.id">
                  <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/60 flex flex-col sm:flex-row gap-4 hover:border-indigo-200 transition">
                    <template x-if="log.photo">
                      <div class="w-full sm:w-28 h-36 sm:h-28 flex-shrink-0 bg-slate-200 rounded-lg overflow-hidden relative cursor-pointer" @click="viewPhoto(log.photo)">
                        <img :src="log.photo" alt="독서 인증 사진" class="w-full h-full object-cover">
                        <span class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded backdrop-blur-sm">
                          <i class="fa-solid fa-magnifying-glass-plus"></i> 확대
                        </span>
                      </div>
                    </template>
                    <template x-if="!log.photo">
                      <div class="w-full sm:w-28 h-20 sm:h-28 flex-shrink-0 bg-slate-100 rounded-lg flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-image text-2xl"></i>
                      </div>
                    </template>

                    <div class="flex-grow flex flex-col justify-between space-y-2">
                      <div>
                        <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                          <span class="font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" x-text="'📖 ' + log.pages + ' 쪽'"></span>
                          <span x-text="log.date"></span>
                        </div>
                        <p class="text-sm text-slate-800 font-medium leading-relaxed bg-white p-3 rounded-lg border border-slate-200/50" x-text="log.thought"></p>
                      </div>

                      <div class="flex justify-end">
                        <button @click="deleteLog(log.id)" class="text-xs text-rose-500 hover:text-rose-700 transition">
                          <i class="fa-solid fa-trash-can me-1"></i> 삭제
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <template x-if="getUserBooks(nickname).length === 0">
            <div class="bg-white rounded-2xl p-10 text-center border border-slate-200/80 shadow-sm">
              <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-book-medical"></i>
              </div>
              <h3 class="text-lg font-bold text-slate-800 mb-1">등록된 책이 없습니다</h3>
              <p class="text-slate-500 text-sm mb-6">첫 독서 활동을 기록하려면 읽고 있는 책을 추가해주세요.</p>
              <button @click="openNewBookModal = true" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition inline-flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>첫 도서 추가하기</span>
              </button>
            </div>
          </template>
        </div>

        <!-- TAB 2: 독서 순위 (리더보드) -->
        <div x-show="currentTab === 'ranking'" class="space-y-4">
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="font-bold text-slate-800 text-base">🏆 학생 독서 일수 순위</h3>
                <p class="text-xs text-slate-500">책을 읽고 인증한 날짜(독서 일수)가 높은 순입니다.</p>
              </div>
              <span class="text-xs font-semibold bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full border border-amber-200" x-text="'총 ' + getLeaderboard().length + '명 참여 중'"></span>
            </div>

            <!-- Leaderboard List -->
            <div class="space-y-3">
              <template x-if="getLeaderboard().length === 0">
                <div class="text-center py-8 text-slate-400">
                  <i class="fa-solid fa-trophy text-4xl mb-2 text-slate-300"></i>
                  <p class="text-sm">아직 등록된 독서 순위 데이터가 없습니다.</p>
                </div>
              </template>

              <template x-for="(user, index) in getLeaderboard()" :key="user.nickname">
                <div class="flex items-center justify-between p-3.5 rounded-xl border transition"
                     :class="index === 0 ? 'bg-amber-50/60 border-amber-200' : (index === 1 ? 'bg-slate-50 border-slate-200' : (index === 2 ? 'bg-orange-50/50 border-orange-200' : 'bg-white border-slate-100'))">
                  <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-black text-sm"
                         :class="index === 0 ? 'bg-amber-400 text-white shadow-sm' : (index === 1 ? 'bg-slate-300 text-slate-700' : (index === 2 ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-500'))">
                      <template x-if="index === 0"><span>🥇</span></template>
                      <template x-if="index === 1"><span>🥈</span></template>
                      <template x-if="index === 2"><span>🥉</span></template>
                      <template x-if="index > 2"><span x-text="index + 1"></span></template>
                    </div>
                    <div>
                      <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                        <span x-text="user.nickname"></span>
                        <template x-if="user.nickname === nickname">
                          <span class="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-1.5 py-0.2 rounded-full">(나)</span>
                        </template>
                      </div>
                      <div class="text-xs text-slate-400">
                        <span x-text="'읽은 책 ' + user.bookCount + '권'"></span> • <span x-text="'총 ' + user.logCount + '회 기록'"></span>
                      </div>
                    </div>
                  </div>
                  <div class="text-right">
                    <span class="text-lg font-black" :class="index === 0 ? 'text-amber-600' : 'text-indigo-600'" x-text="user.days + '일'"></span>
                    <span class="block text-[10px] text-slate-400">누적 독서</span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

      </div>
    </template>
  </main>

  <!-- MODAL: Google School Account Modal -->
  <div x-show="openGoogleModal" 
       class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" 
       x-transition.opacity x-cloak>
    <div @click.away="openGoogleModal = false" class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i class="fa-brands fa-google text-indigo-600"></i> 학교 구글 계정 인증
        </h3>
        <button @click="openGoogleModal = false" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>

  <script>
    function readingApp() {
      return {
        nickname: localStorage.getItem('reading_user_nickname') || '',
        userPin: localStorage.getItem('reading_user_pin') || '',
        userEmail: localStorage.getItem('reading_user_email') || '',
        inputNickname: '',
        inputPin: '',
        loginError: '',
        googleLoginError: '',
        cameraError: '',
        currentTab: 'records',
        records: JSON.parse(localStorage.getItem('reading_records') || '[]'),
        
        // Modal states
        openNewBookModal: false,
        openLogFormModal: false,
        openCameraModal: false,
        openGasModal: false,
        openGoogleModal: false,
        viewPhotoUrl: '',

        // Google Login Form State
        googleForm: {
          name: '',
          email: '',
          pin: ''
        },

        // Form inputs
        selectedBookTitle: '',
        newBookTitle: '',
        logForm: {
          date: new Date().toISOString().split('T')[0],
          pages: '',
          thought: '',
          photo: ''
        },

        // WebRTC Camera states
        videoStream: null,
        facingMode: 'environment',

        // GAS Integration URL
        gasUrl: localStorage.getItem('reading_gas_url') || 'https://script.google.com/macros/s/AKfycbwi0uhBhxcbTJS1Vpv1OqLcwI40wOJVFr284e67U5b7rjROa3zlw25DC_tkgqMNPmA/exec',

        init() {
          const books = this.getUserBooks(this.nickname);
          if (books.length > 0) {
            this.selectedBookTitle = books[0];
          }

          if (this.gasUrl) {
            this.fetchFromGas();
          }
        },

        login() {
          const nick = this.inputNickname.trim();
          const pin = this.inputPin.trim();

          if (!nick || !pin) {
            this.loginError = '닉네임과 4자리 PIN 번호를 모두 입력해주세요.';
            return;
          }

          const existingUserLog = this.records.find(r => r.nickname === nick && r.pin);
          if (existingUserLog && existingUserLog.pin !== pin) {
            this.loginError = '🔒 이미 등록된 닉네임입니다. 비밀번호(PIN)가 일치하지 않습니다.';
            return;
          }

          this.nickname = nick;
          this.userPin = pin;
          this.userEmail = '';
          this.loginError = '';

          localStorage.setItem('reading_user_nickname', this.nickname);
          localStorage.setItem('reading_user_pin', this.userPin);
          localStorage.removeItem('reading_user_email');
          
          const books = this.getUserBooks(this.nickname);
          this.selectedBookTitle = books.length > 0 ? books[0] : '';
          this.inputNickname = '';
          this.inputPin = '';
        },

        loginWithGoogleAccount() {
          const name = this.googleForm.name.trim();
          const email = this.googleForm.email.trim();
          const pin = this.googleForm.pin.trim();

          if (!name || !email || !pin) {
            this.googleLoginError = '이름, 구글 이메일, 4자리 PIN 번호를 모두 입력해주세요.';
            return;
          }

          if (!email.includes('@')) {
            this.googleLoginError = '올바른 학교 구글 이메일 주소를 입력해주세요.';
            return;
          }

          const userNick = `${name}`;
          const existingUserLog = this.records.find(r => (r.nickname === userNick || r.email === email) && r.pin);

          if (existingUserLog && existingUserLog.pin !== pin) {
            this.googleLoginError = '🔒 비밀번호(PIN)가 일치하지 않습니다.';
            return;
          }

          this.nickname = userNick;
          this.userEmail = email;
          this.userPin = pin;
          this.googleLoginError = '';

          localStorage.setItem('reading_user_nickname', this.nickname);
          localStorage.setItem('reading_user_email', this.userEmail);
          localStorage.setItem('reading_user_pin', this.userPin);

          const books = this.getUserBooks(this.nickname);
          this.selectedBookTitle = books.length > 0 ? books[0] : '';

          this.googleForm = { name: '', email: '', pin: '' };
          this.openGoogleModal = false;
        },

        logout() {
          this.nickname = '';
          this.userPin = '';
          this.userEmail = '';
          localStorage.removeItem('reading_user_nickname');
          localStorage.removeItem('reading_user_pin');
          localStorage.removeItem('reading_user_email');
          this.selectedBookTitle = '';
        },

        getUserBooks(nick) {
          if (!nick) return [];
          const userLogs = this.records.filter(r => r.nickname === nick);
          const books = [...new Set(userLogs.map(r => r.bookTitle))];
          return books;
        },

        getUserLogs(nick, bookTitle = null) {
          if (!nick) return [];
          return this.records.filter(r => {
            if (bookTitle) {
              return r.nickname === nick && r.bookTitle === bookTitle;
            }
            return r.nickname === nick;
          }).sort((a, b) => new Date(b.date) - new Date(a.date));
        },

        getUserReadingDays(nick) {
          if (!nick) return 0;
          const userLogs = this.records.filter(r => r.nickname === nick);
          const uniqueDates = new Set(userLogs.map(r => r.date));
          return uniqueDates.size;
        },

        getLeaderboard() {
          const userMap = {};

          this.records.forEach(log => {
            if (!userMap[log.nickname]) {
              userMap[log.nickname] = {
                nickname: log.nickname,
                dates: new Set(),
                books: new Set(),
                logCount: 0
              };
            }
            userMap[log.nickname].dates.add(log.date);
            userMap[log.nickname].books.add(log.bookTitle);
            userMap[log.nickname].logCount += 1;
          });

          const leaderboard = Object.values(userMap).map(u => ({
            nickname: u.nickname,
            days: u.dates.size,
            bookCount: u.books.size,
            logCount: u.logCount
          }));

          return leaderboard.sort((a, b) => b.days - a.days || b.logCount - a.logCount);
        },

        addNewBook() {
          const title = this.newBookTitle.trim();
          if (!title) return;

          this.selectedBookTitle = title;
          this.newBookTitle = '';
          this.openNewBookModal = false;
          this.openLogModal();
        },

        openLogModal() {
          this.logForm = {
            date: new Date().toISOString().split('T')[0],
            pages: '',
            thought: '',
            photo: ''
          };
          this.openLogFormModal = true;
        },

        async startCamera() {
          this.cameraError = '';
          this.openCameraModal = true;
          try {
            const constraints = {
              video: { facingMode: this.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            };
            this.videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            this.$nextTick(() => {
              const videoElem = this.$refs.cameraVideo;
              if (videoElem) {
                videoElem.srcObject = this.videoStream;
              }
            });
          } catch (err) {
            console.error("Camera access error:", err);
            this.cameraError = '카메라에 접근할 수 없습니다. 권한을 확인해주세요.';
          }
        },

        switchCamera() {
          this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
          this.stopCameraStream();
          this.startCamera();
        },

        capturePhoto() {
          const videoElem = this.$refs.cameraVideo;
          if (!videoElem) return;
          const canvas = document.createElement('canvas');
          canvas.width = videoElem.videoWidth || 640;
          canvas.height = videoElem.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
          this.logForm.photo = canvas.toDataURL('image/jpeg', 0.7);
          this.closeCamera();
        },

        closeCamera() {
          this.stopCameraStream();
          this.openCameraModal = false;
        },

        stopCameraStream() {
          if (this.videoStream) {
            this.videoStream.getTracks().forEach(track => track.stop());
            this.videoStream = null;
          }
        },

        handleImageUpload(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 600;
              let width = img.width;
              let height = img.height;

              if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              this.logForm.photo = canvas.toDataURL('image/jpeg', 0.7);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

        saveActivityLog() {
          if (!this.selectedBookTitle || !this.logForm.pages || !this.logForm.thought) return;

          const newRecord = {
            id: Date.now(),
            nickname: this.nickname,
            email: this.userEmail || '',
            pin: this.userPin,
            bookTitle: this.selectedBookTitle,
            pages: this.logForm.pages,
            thought: this.logForm.thought,
            photo: this.logForm.photo || '',
            date: this.logForm.date,
            timestamp: new Date().toISOString()
          };

          this.records.unshift(newRecord);
          this.saveRecordsLocally();
          this.syncToGas(newRecord);

          this.openLogFormModal = false;
        },

        deleteLog(id) {
          this.records = this.records.filter(r => r.id !== id);
          this.saveRecordsLocally();
        },

        saveRecordsLocally() {
          localStorage.setItem('reading_records', JSON.stringify(this.records));
        },

        viewPhoto(url) {
          this.viewPhotoUrl = url;
        },

        saveGasUrl() {
          localStorage.setItem('reading_gas_url', this.gasUrl.trim());
          this.fetchFromGas();
        },

        async syncToGas(record) {
          if (!this.gasUrl) return;
          try {
            await fetch(this.gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(record)
            });
          } catch (err) {
            console.error('GAS Sync Error:', err);
          }
        },

        async fetchFromGas() {
          if (!this.gasUrl) return;
          try {
            const response = await fetch(this.gasUrl);
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) {
              this.records = data;
              this.saveRecordsLocally();

              if (this.nickname && (!this.selectedBookTitle || !this.getUserBooks(this.nickname).includes(this.selectedBookTitle))) {
                const books = this.getUserBooks(this.nickname);
                if (books.length > 0) {
                  this.selectedBookTitle = books[0];
                }
              }
            }
          } catch (err) {
            console.log('Using local dataset or GAS fetch failed:', err);
          }
        }
      };
    }
  </script>
</body>
