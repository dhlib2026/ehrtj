<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📚 대현고등학교 독서 인증 시스템</title>
  
  <script>
    window.handleGoogleCredentialResponse = function(response) {
      if (!response || !response.credential) return;
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        const payload = JSON.parse(jsonPayload);
        if (payload && payload.email) {
          // Dispatch custom window event for robust Alpine v3 communication
          window.dispatchEvent(new CustomEvent('google-login-success', { detail: payload }));
        }
      } catch (err) {
        console.warn("Google Auth Response Parsing Notice:", err);
      }
    };
  </script>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js for reactive UI -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between" x-data="readingApp()">

  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="https://dhlib2026.github.io/ehrtj/" class="flex items-center space-x-3 hover:opacity-90 transition">
        <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
          <i class="fa-solid fa-book-open text-xl text-yellow-300"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">대현고 독서 인증</h1>
          <p class="text-xs text-indigo-200">대현고등학교 독서 기록장</p>
        </div>
      </a>

      <!-- User Badge & Actions -->
      <template x-if="nickname">
        <div class="flex items-center space-x-2">
          <div class="bg-indigo-700/80 px-3 py-1.5 rounded-full border border-indigo-400/40 text-xs flex items-center space-x-2">
            <template x-if="userEmail">
              <i class="fa-brands fa-google text-emerald-300" title="구글 연동 계정"></i>
            </template>
            <template x-if="!userEmail">
              <i class="fa-solid fa-user-circle text-yellow-300"></i>
            </template>
            <span class="font-semibold" x-text="nickname"></span>
            <span class="bg-yellow-400 text-indigo-950 font-extrabold px-1.5 py-0.5 rounded-full text-[10px]" x-text="getUserReadingDays(nickname) + '일째'"></span>
          </div>
          <button @click="logout()" title="로그아웃" class="text-indigo-200 hover:text-white p-1.5 rounded-lg hover:bg-indigo-700 transition">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </template>
    </div>
  </header>

  <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow">

    <template x-if="!nickname">
      <div class="my-6 bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 text-center max-w-md mx-auto">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-1">대현고 독서 인증 📚</h2>
        <p class="text-slate-500 text-xs sm:text-sm mb-5">대현고등학교 스마트 독서 기록장 시스템</p>

        <!-- Auth Mode Switcher Tabs -->
        <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200/80">
          <button type="button" @click="authMode = 'login'; loginError = ''; registerError = ''; renderGoogleButtons();" 
                  :class="authMode === 'login' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-500 hover:text-slate-800 font-medium'"
                  class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-key text-xs"></i>
            <span>기존 회원 로그인</span>
          </button>
          <button type="button" @click="authMode = 'register'; loginError = ''; registerError = ''; renderGoogleButtons();" 
                  :class="authMode === 'register' ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'text-slate-500 hover:text-slate-800 font-medium'"
                  class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-user-plus text-xs"></i>
            <span>신규 회원 가입</span>
          </button>
        </div>

        <!-- A. EXISTING MEMBER LOGIN FORM -->
        <div x-show="authMode === 'login'" class="space-y-5 text-left">
          
          <!-- Google Login -->
          <div class="bg-indigo-50/60 rounded-2xl p-4 border border-indigo-100 text-center">
            <span class="block text-xs font-bold text-indigo-900 mb-2">⚡ 구글 계정 간편 로그인</span>
            <div id="googleSignInBtn" class="flex justify-center min-h-[44px]"></div>
          </div>

          <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-3 text-[11px] text-slate-400 font-medium">또는 학번/비밀번호 로그인</span>
            <div class="flex-grow border-t border-slate-200"></div>
          </div>

          <!-- Manual ID/PIN Login -->
          <form @submit.prevent="loginWithPin()" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1 ml-1">학생 이름 / 학번</label>
              <input type="text" x-model="inputNickname" required placeholder="예: 20101 홍길동" 
                     class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1 ml-1">비밀번호 (PIN 숫자 4자리)</label>
              <input type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" 
                     x-model="inputPin" @input="inputPin = inputPin.replace(/[^0-9]/g, '')" required placeholder="가입 시 설정한 숫자 4자리" 
                     class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm text-center tracking-widest font-bold">
            </div>

            <template x-if="loginError">
              <div class="text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-xl font-medium" x-text="loginError"></div>
            </template>

            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 active:scale-[0.99] transition flex items-center justify-center space-x-2 text-sm">
              <span>로그인하기</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </form>
        </div>

        <!-- B. NEW MEMBER REGISTRATION FORM -->
        <div x-show="authMode === 'register'" class="space-y-5 text-left">
          <p class="text-xs text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-200/60 leading-relaxed">
            ✨ 대현고 독서 인증을 처음 이용하시나요? 구글 계정으로 손쉽게 가입하거나 학번과 비밀번호(숫자 4자리)를 설정해 새로 시작하세요.
          </p>

          <!-- Method 1: Google Register -->
          <div class="space-y-2">
            <span class="block text-xs font-bold text-slate-700 ml-1">🔵 방법 1. 구글 인증으로 가입</span>
            <div class="bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100 text-center">
              <p class="text-[11px] text-indigo-700 mb-2">구글 버튼을 누르고 최초 1회만 학번을 연결하세요.</p>
              <div id="googleRegisterBtn" class="flex justify-center min-h-[44px]"></div>
            </div>
          </div>

          <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-3 text-[11px] text-slate-400 font-medium">또는 학번/비밀번호 가입</span>
            <div class="flex-grow border-t border-slate-200"></div>
          </div>

          <!-- Method 2: Direct ID / PIN Register -->
          <form @submit.prevent="registerDirectUser()" class="space-y-3.5">
            <span class="block text-xs font-bold text-slate-700 ml-1">📝 방법 2. 학번 및 비밀번호 직접 가입</span>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1 ml-1">학생 이름 / 학번 *</label>
              <input type="text" x-model="regNickname" required placeholder="예: 20101 홍길동" 
                     class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1 ml-1">새 비밀번호 설정 (숫자 4자리) *</label>
              <input type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" 
                     x-model="regPin" @input="regPin = regPin.replace(/[^0-9]/g, '')" required placeholder="숫자 4자리 지정 (예: 1111)" 
                     class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm text-center tracking-widest font-bold">
            </div>

            <template x-if="registerError">
              <div class="text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-xl font-medium" x-text="registerError"></div>
            </template>

            <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-100 active:scale-[0.99] transition flex items-center justify-center space-x-2 text-sm">
              <i class="fa-solid fa-user-check"></i>
              <span>신규 회원 가입 및 시작</span>
            </button>
          </form>
        </div>

        <div class="mt-8 pt-5 border-t border-slate-100 text-center text-xs text-slate-400">
          <span>📚 대현고등학교 독서 프로젝트</span>
        </div>
      </div>
    </template>

    <template x-if="nickname">
      <div class="space-y-6">

        <!-- Banner Summary Card -->
        <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-indigo-500/20 text-9xl pointer-events-none">
            <i class="fa-solid fa-book"></i>
          </div>
          
          <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="inline-block bg-indigo-500/50 text-indigo-100 text-xs px-2.5 py-0.5 rounded-full mb-1">
                오늘도 즐거운 독서 시간 📖
              </span>
              <h2 class="text-xl font-extrabold flex items-center gap-2">
                <span x-text="nickname"></span> 학생의 독서함
              </h2>
            </div>

            <div class="flex items-center gap-3 bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
              <div class="text-center px-3 border-r border-white/20">
                <div class="text-xs text-indigo-200">총 독서 일수</div>
                <div class="text-xl font-black text-yellow-300" x-text="getUserReadingDays(nickname) + '일'"></div>
              </div>
              <div class="text-center px-3 border-r border-white/20">
                <div class="text-xs text-indigo-200">등록 도서</div>
                <div class="text-xl font-black text-white" x-text="getUserBooks(nickname).length + '권'"></div>
              </div>
              <div class="text-center px-3">
                <div class="text-xs text-indigo-200">활동 기록</div>
                <div class="text-xl font-black text-emerald-300" x-text="getUserLogs(nickname).length + '개'"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab Navigation Buttons -->
        <div class="flex bg-slate-200/80 p-1 rounded-2xl text-slate-600 font-medium text-sm">
          <button @click="currentTab = 'records'" 
                  :class="currentTab === 'records' ? 'bg-white text-indigo-700 shadow-md font-bold' : 'hover:text-slate-900'"
                  class="flex-1 py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-book-journal-whills"></i>
            <span>내 독서 기록</span>
          </button>
          <button @click="currentTab = 'ranking'" 
                  :class="currentTab === 'ranking' ? 'bg-white text-indigo-700 shadow-md font-bold' : 'hover:text-slate-900'"
                  class="flex-1 py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-trophy text-amber-500"></i>
            <span>독서 순위</span>
          </button>
        </div>

        <!-- TAB 1: 내 독서 기록 -->
        <div x-show="currentTab === 'records'" class="space-y-5">
          
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <div class="flex-grow">
              <label class="block text-xs font-semibold text-slate-500 mb-1">독서 중인 도서 선택</label>
              <select x-model="selectedBookTitle" 
                      class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <template x-if="getUserBooks(nickname).length === 0">
                  <option value="">등록된 도서가 없습니다. 새 도서를 추가해주세요.</option>
                </template>
                <template x-for="book in getUserBooks(nickname)" :key="book">
                  <option :value="book" x-text="book"></option>
                </template>
              </select>
            </div>

            <div class="flex items-center gap-2 pt-1 sm:pt-4">
              <button @click="openNewBookModal = true" 
                      class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-2.5 rounded-xl transition flex items-center whitespace-nowrap border border-indigo-200">
                <i class="fa-solid fa-plus me-1.5"></i> 새 도서 추가
              </button>
              
              <button @click="openLogModal()" 
                      :disabled="!selectedBookTitle"
                      :class="!selectedBookTitle ? 'bg-slate-300 cursor-not-allowed text-slate-500' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200'"
                      class="flex-1 sm:flex-none text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center justify-center whitespace-nowrap">
                <i class="fa-solid fa-pen-to-square me-1.5"></i> 활동 기록 쓰기
              </button>
            </div>
          </div>

          <template x-if="selectedBookTitle">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
              <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                <div>
                  <span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">현재 선택된 도서</span>
                  <h3 class="text-lg font-bold text-slate-800 mt-1" x-text="selectedBookTitle"></h3>
                </div>
                <div class="text-right">
                  <span class="text-xs text-slate-400">누적 활동</span>
                  <div class="text-base font-bold text-indigo-600" x-text="getUserLogs(nickname, selectedBookTitle).length + '회'"></div>
                </div>
              </div>

              <div class="space-y-4">
                <template x-if="getUserLogs(nickname, selectedBookTitle).length === 0">
                  <div class="text-center py-8 text-slate-400">
                    <i class="fa-regular fa-file-lines text-4xl mb-2 text-slate-300"></i>
                    <p class="text-sm">아직 기록된 독서 활동이 없습니다.</p>
                  </div>
                </template>

                <template x-for="log in getUserLogs(nickname, selectedBookTitle)" :key="log.id">
                  <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/60 flex flex-col sm:flex-row gap-4 hover:border-indigo-200 transition">
                    <template x-if="log.photo">
                      <div class="w-full sm:w-28 h-36 sm:h-28 flex-shrink-0 bg-slate-200 rounded-lg overflow-hidden relative cursor-pointer" @click="viewPhoto(log.photo)">
                        <img :src="log.photo" alt="독서 인증 사진" class="w-full h-full object-cover">
                      </div>
                    </template>
                    <template x-if="!log.photo">
                      <div class="w-full sm:w-28 h-20 sm:h-28 flex-shrink-0 bg-slate-100 rounded-lg flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-image text-2xl"></i>
                      </div>
                    </template>

                    <div class="flex-grow flex flex-col justify-between space-y-2">
                      <div>
                        <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                          <span class="font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" x-text="'📖 ' + log.pages + ' 쪽'"></span>
                          <span x-text="log.date"></span>
                        </div>
                        <p class="text-sm text-slate-800 font-medium leading-relaxed bg-white p-3 rounded-lg border border-slate-200/50" x-text="log.thought"></p>
                      </div>

                      <div class="flex justify-end">
                        <button @click="deleteLog(log.id)" class="text-xs text-rose-500 hover:text-rose-700 transition">
                          <i class="fa-solid fa-trash-can me-1"></i> 삭제
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <template x-if="getUserBooks(nickname).length === 0">
            <div class="bg-white rounded-2xl p-10 text-center border border-slate-200/80 shadow-sm">
              <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-book-medical"></i>
              </div>
              <h3 class="text-lg font-bold text-slate-800 mb-1">등록된 책이 없습니다</h3>
              <p class="text-slate-500 text-sm mb-6">첫 독서 활동을 기록하려면 읽고 있는 책을 추가해주세요.</p>
              <button @click="openNewBookModal = true" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition inline-flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>첫 도서 추가하기</span>
              </button>
            </div>
          </template>
        </div>

        <!-- TAB 2: 독서 순위 -->
        <div x-show="currentTab === 'ranking'" class="space-y-4">
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="font-bold text-slate-800 text-base">🏆 학생 독서 일수 순위</h3>
                <p class="text-xs text-slate-500">책을 읽고 인증한 날짜(독서 일수)가 높은 순입니다.</p>
              </div>
              <span class="text-xs font-semibold bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full border border-amber-200" x-text="'총 ' + getLeaderboard().length + '명 참여 중'"></span>
            </div>

            <div class="space-y-3">
              <template x-if="getLeaderboard().length === 0">
                <div class="text-center py-8 text-slate-400">
                  <i class="fa-solid fa-trophy text-4xl mb-2 text-slate-300"></i>
                  <p class="text-sm">아직 등록된 독서 순위 데이터가 없습니다.</p>
                </div>
              </template>

              <template x-for="(user, index) in getLeaderboard()" :key="user.nickname">
                <div class="flex items-center justify-between p-3.5 rounded-xl border transition"
                     :class="index === 0 ? 'bg-amber-50/60 border-amber-200' : (index === 1 ? 'bg-slate-50 border-slate-200' : (index === 2 ? 'bg-orange-50/50 border-orange-200' : 'bg-white border-slate-100'))">
                  <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-black text-sm"
                         :class="index === 0 ? 'bg-amber-400 text-white shadow-sm' : (index === 1 ? 'bg-slate-300 text-slate-700' : (index === 2 ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-500'))">
                      <template x-if="index === 0"><span>🥇</span></template>
                      <template x-if="index === 1"><span>🥈</span></template>

  <script>
    function readingApp() {
      return {
        nickname: localStorage.getItem('reading_user_nickname') || '',
        userPin: localStorage.getItem('reading_user_pin') || '',
        userEmail: localStorage.getItem('reading_user_email') || '',
        
        googleUserMap: JSON.parse(localStorage.getItem('reading_google_users') || '{}'),
        usersDb: JSON.parse(localStorage.getItem('reading_users_db') || '{}'),

        authMode: 'login',

        inputNickname: '',
        inputPin: '',
        loginError: '',

        regNickname: '',
        regPin: '',
        registerError: '',

        googleLoginError: '',
        cameraError: '',
        currentTab: 'records',
        records: JSON.parse(localStorage.getItem('reading_records') || '[]'),
        
        openNewBookModal: false,
        openLogFormModal: false,
        openCameraModal: false,
        openGoogleModal: false,
        viewPhotoUrl: '',

        pendingGoogleUser: null,
        googleForm: {
          name: '',
          email: ''
        },

        selectedBookTitle: '',
        newBookTitle: '',
        logForm: {
          date: new Date().toISOString().split('T')[0],
          pages: '',
          thought: '',
          photo: ''
        },

        videoStream: null,
        facingMode: 'environment',

        gasUrl: 'https://script.google.com/macros/s/AKfycbwi0uhBhxcbTJS1Vpv1OqLcwI40wOJVFr284e67U5b7rjROa3zlw25DC_tkgqMNPmA/exec',

        init() {
          // Listen to global Google login event
          window.addEventListener('google-login-success', (e) => {
            this.handleGoogleLoginSuccess(e.detail);
          });

          const books = this.getUserBooks(this.nickname);
          if (books.length > 0) {
            this.selectedBookTitle = books[0];
          }

          if (this.gasUrl) {
            this.fetchFromGas();
          }

          this.renderGoogleButtons();
        },

        logout() {
          try {
            if (window.google && window.google.accounts && window.google.accounts.id) {
              window.google.accounts.id.disableAutoSelect();
            }
          } catch (err) {
            console.warn("Google Logout Disable AutoSelect Notice:", err);
          }

          this.nickname = '';
          this.userPin = '';
          this.userEmail = '';
          this.selectedBookTitle = '';
          this.inputNickname = '';
          this.inputPin = '';
          this.regNickname = '';
          this.regPin = '';
          this.loginError = '';
          this.registerError = '';
          this.googleLoginError = '';
          this.pendingGoogleUser = null;

          localStorage.removeItem('reading_user_nickname');
          localStorage.removeItem('reading_user_pin');
          localStorage.removeItem('reading_user_email');

          this.renderGoogleButtons();
        },

        renderGoogleButtons() {
          this.$nextTick(() => {
            const checkGsi = setInterval(() => {
              if (window.google && window.google.accounts && window.google.accounts.id) {
                clearInterval(checkGsi);

                window.google.accounts.id.initialize({
                  client_id: '475801120252-ee3s47hd2rukvko4pcia6os368kujpto.apps.googleusercontent.com',
                  callback: window.handleGoogleCredentialResponse,
                  auto_select: false
                });

                const loginBtn = document.getElementById('googleSignInBtn');
                if (loginBtn) {
                  loginBtn.innerHTML = '';
                  window.google.accounts.id.renderButton(loginBtn, {
                    type: 'standard',
                    theme: 'outline',
                    size: 'large',
                    text: 'sign_in_with',
                    shape: 'pill',
                    width: 260
                  });
                }

                const regBtn = document.getElementById('googleRegisterBtn');
                if (regBtn) {
                  regBtn.innerHTML = '';
                  window.google.accounts.id.renderButton(regBtn, {
                    type: 'standard',
                    theme: 'filled_blue',
                    size: 'large',
                    text: 'signup_with',
                    shape: 'pill',
                    width: 260
                  });
                }
              }
            }, 100);

            setTimeout(() => clearInterval(checkGsi), 4000);
          });
        },

        getStoredPin(nickname) {
          if (!nickname) return null;
          const cleanNick = String(nickname).trim();

          if (this.usersDb[cleanNick] && this.usersDb[cleanNick].pin) {
            return String(this.usersDb[cleanNick].pin).trim();
          }

          const foundRecord = this.records.find(r => String(r.nickname || '').trim() === cleanNick && r.pin);
          if (foundRecord) {
            return String(foundRecord.pin).trim();
          }

          return null;
        },

        cleanPinInput(val) {
          return String(val || '').replace(/[^0-9]/g, '').slice(0, 4);
        },

        loginWithPin() {
          const nick = String(this.inputNickname || '').trim();
          const pin = this.cleanPinInput(this.inputPin);
          this.inputPin = pin;

          if (!nick) {
            this.loginError = '학생 이름/학번을 입력해주세요.';
            return;
          }

          if (!pin || pin.length !== 4) {
            this.loginError = '비밀번호는 숫자 4자리로 입력하셔야 합니다.';
            return;
          }

          const storedPin = this.getStoredPin(nick);

          if (!storedPin) {
            this.loginError = '등록되지 않은 학번/이름입니다. 하단의 "신규 회원 가입"을 이용해 주세요.';
            return;
          }

          if (storedPin !== pin) {
            this.loginError = '🔒 비밀번호(PIN 4자리)가 일치하지 않습니다. 다시 확인해주세요.';
            return;
          }

          this.nickname = nick;
          this.userPin = pin;
          this.userEmail = this.usersDb[nick]?.email || '';
          this.loginError = '';

          localStorage.setItem('reading_user_nickname', this.nickname);
          localStorage.setItem('reading_user_pin', this.userPin);

          this.usersDb[nick] = { pin: pin, email: this.userEmail };
          localStorage.setItem('reading_users_db', JSON.stringify(this.usersDb));
          
          const books = this.getUserBooks(this.nickname);
          this.selectedBookTitle = books.length > 0 ? books[0] : '';
          this.inputNickname = '';
          this.inputPin = '';
        },

        registerDirectUser() {
          const nick = String(this.regNickname || '').trim();
          const pin = this.cleanPinInput(this.regPin);
          this.regPin = pin;

          if (!nick) {
            this.registerError = '학생 이름/학번을 입력해주세요.';
            return;
          }

          if (!pin || pin.length !== 4) {
            this.registerError = '새 비밀번호는 숫자 4자리(예: 1111)로 지정해야 합니다.';
            return;
          }

          const storedPin = this.getStoredPin(nick);

          if (storedPin) {
            this.registerError = '❌ 이미 가입된 학번/이름입니다. "기존 회원 로그인" 탭을 이용해 주세요.';
            return;
          }

          this.usersDb[nick] = { pin: pin, email: '' };
          localStorage.setItem('reading_users_db', JSON.stringify(this.usersDb));

          this.nickname = nick;
          this.userPin = pin;
          this.userEmail = '';
          this.registerError = '';

          localStorage.setItem('reading_user_nickname', this.nickname);
          localStorage.setItem('reading_user_pin', this.userPin);

          const registrationRecord = {
            id: Date.now(),
            nickname: nick,
            email: '',
            pin: pin,
            bookTitle: '회원가입',
            pages: '-',
            thought: '대현고 독서 인증 회원가입 완료',
            photo: '',
            date: new Date().toISOString().split('T')[0],
            timestamp: new Date().toISOString()
          };

          this.records.unshift(registrationRecord);
          this.saveRecordsLocally();
          this.syncToGas(registrationRecord);

          this.selectedBookTitle = '';
          this.regNickname = '';
          this.regPin = '';
        },

        handleGoogleLoginSuccess(payload) {
          const email = payload.email;
          if (!email) return;

          if (this.googleUserMap[email]) {
            const savedStudent = this.googleUserMap[email];
            this.nickname = savedStudent.nickname;
            this.userEmail = email;
            this.userPin = 'GOOGLE';

            localStorage.setItem('reading_user_nickname', this.nickname);
            localStorage.setItem('reading_user_email', this.userEmail);
            localStorage.setItem('reading_user_pin', 'GOOGLE');

            const books = this.getUserBooks(this.nickname);
            this.selectedBookTitle = books.length > 0 ? books[0] : '';
          } else {
            this.pendingGoogleUser = payload;
            this.googleForm.email = email;
            this.googleForm.name = payload.name || '';
            this.openGoogleModal = true;
          }
        },

        loginWithGoogleAccount() {
          const name = this.googleForm.name.trim();
          const email = this.googleForm.email.trim();

          if (!name || !email) {
            this.googleLoginError = '학생 이름/학번을 입력해주세요.';
            return;
          }

          const existingPin = this.getStoredPin(name);
          if (existingPin && existingPin !== 'GOOGLE') {
            this.googleLoginError = '이미 일반 번호로 가입된 이름입니다. 기존 회원 로그인을 이용하세요.';
            return;
          }

          this.googleUserMap[email] = { nickname: name, email: email };
          this.usersDb[name] = { pin: 'GOOGLE', email: email };

          localStorage.setItem('reading_google_users', JSON.stringify(this.googleUserMap));
          localStorage.setItem('reading_users_db', JSON.stringify(this.usersDb));

          this.nickname = name;
          this.userEmail = email;
          this.userPin = 'GOOGLE';

          localStorage.setItem('reading_user_nickname', this.nickname);
          localStorage.setItem('reading_user_email', this.userEmail);
          localStorage.setItem('reading_user_pin', 'GOOGLE');

          const registrationRecord = {
            id: Date.now(),
            nickname: name,
            email: email,
            pin: 'GOOGLE',
            bookTitle: '회원가입',
            pages: '-',
            thought: '구글 계정 연동 가입 완료',
            photo: '',
            date: new Date().toISOString().split('T')[0],
            timestamp: new Date().toISOString()
          };

          this.records.unshift(registrationRecord);
          this.saveRecordsLocally();
          this.syncToGas(registrationRecord);

          const books = this.getUserBooks(this.nickname);
          this.selectedBookTitle = books.length > 0 ? books[0] : '';

          this.googleForm = { name: '', email: '' };
          this.openGoogleModal = false;
        },

        getUserBooks(nick) {
          if (!nick) return [];
          const userLogs = this.records.filter(r => r.nickname === nick && r.bookTitle && r.bookTitle !== '회원가입');
          return [...new Set(userLogs.map(r => r.bookTitle))];
        },

        getUserLogs(nick, bookTitle = null) {
          if (!nick) return [];
          return this.records.filter(r => {
            if (r.bookTitle === '회원가입') return false;
            if (bookTitle) {
              return r.nickname === nick && r.bookTitle === bookTitle;
            }
            return r.nickname === nick;
          }).sort((a, b) => new Date(b.date) - new Date(a.date));
        },

        getUserReadingDays(nick) {
          if (!nick) return 0;
          const userLogs = this.records.filter(r => r.nickname === nick && r.bookTitle !== '회원가입');
          return new Set(userLogs.map(r => r.date)).size;
        },

        getLeaderboard() {
          const userMap = {};
          this.records.forEach(log => {
            if (!log.nickname || log.bookTitle === '회원가입') return;
            if (!userMap[log.nickname]) {
              userMap[log.nickname] = {
                nickname: log.nickname,
                dates: new Set(),
                books: new Set(),
                logCount: 0
              };
            }
            userMap[log.nickname].dates.add(log.date);
            userMap[log.nickname].books.add(log.bookTitle);
            userMap[log.nickname].logCount += 1;
          });

          return Object.values(userMap).map(u => ({
            nickname: u.nickname,
            days: u.dates.size,
            bookCount: u.books.size,
            logCount: u.logCount
          })).sort((a, b) => b.days - a.days || b.logCount - a.logCount);
        },

        addNewBook() {
          const title = this.newBookTitle.trim();
          if (!title) return;
          this.selectedBookTitle = title;
          this.newBookTitle = '';
          this.openNewBookModal = false;
          this.openLogModal();
        },

        openLogModal() {
          this.logForm = {
            date: new Date().toISOString().split('T')[0],
            pages: '',
            thought: '',
            photo: ''
          };
          this.openLogFormModal = true;
        },

        async startCamera() {
          this.cameraError = '';
          this.openCameraModal = true;
          try {
            const constraints = {
              video: { facingMode: this.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            };
            this.videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            this.$nextTick(() => {
              const videoElem = this.$refs.cameraVideo;
              if (videoElem) {
                videoElem.srcObject = this.videoStream;
              }
            });
          } catch (err) {
            console.error("Camera access error:", err);
            this.cameraError = '카메라에 접근할 수 없습니다.';
          }
        },

        switchCamera() {
          this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
          this.stopCameraStream();
          this.startCamera();
        },

        capturePhoto() {
          const videoElem = this.$refs.cameraVideo;
          if (!videoElem) return;
          const canvas = document.createElement('canvas');
          canvas.width = videoElem.videoWidth || 640;
          canvas.height = videoElem.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
          this.logForm.photo = canvas.toDataURL('image/jpeg', 0.7);
          this.closeCamera();
        },

        closeCamera() {
          this.stopCameraStream();
          this.openCameraModal = false;
        },

        stopCameraStream() {
          if (this.videoStream) {
            this.videoStream.getTracks().forEach(track => track.stop());
            this.videoStream = null;
          }
        },

        handleImageUpload(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 600;
              let width = img.width;
              let height = img.height;

              if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              this.logForm.photo = canvas.toDataURL('image/jpeg', 0.7);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

        saveActivityLog() {
          if (!this.selectedBookTitle || !this.logForm.pages || !this.logForm.thought) return;

          const newRecord = {
            id: Date.now(),
            nickname: this.nickname,
            email: this.userEmail || '',
            pin: this.userPin,
            bookTitle: this.selectedBookTitle,
            pages: this.logForm.pages,
            thought: this.logForm.thought,
            photo: this.logForm.photo || '',
            date: this.logForm.date,
            timestamp: new Date().toISOString()
          };

          this.records.unshift(newRecord);
          this.saveRecordsLocally();
          this.syncToGas(newRecord);

          this.openLogFormModal = false;
        },

        deleteLog(id) {
          this.records = this.records.filter(r => r.id !== id);
          this.saveRecordsLocally();
        },

        saveRecordsLocally() {
          localStorage.setItem('reading_records', JSON.stringify(this.records));
        },

        viewPhoto(url) {
          this.viewPhotoUrl = url;
        },

        async syncToGas(record) {
          if (!this.gasUrl) return;
          try {
            await fetch(this.gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(record)
            });
          } catch (err) {
            console.error('GAS Sync Error:', err);
          }
        },

        async fetchFromGas() {
          if (!this.gasUrl) return;
          try {
            const response = await fetch(this.gasUrl);
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) {
              this.records = data;
              this.saveRecordsLocally();

              // Rebuild usersDb and googleUserMap from synced sheet records
              const newUsersDb = {};
              const newGoogleUserMap = {};
              data.forEach(r => {
                if (r.nickname && r.pin) {
                  newUsersDb[r.nickname] = { pin: String(r.pin).trim(), email: r.email || '' };
                }
                if (r.email && (r.pin === 'GOOGLE' || r.email)) {
                  newGoogleUserMap[r.email] = { nickname: r.nickname, email: r.email };
                }
              });
              this.usersDb = { ...newUsersDb, ...this.usersDb };
              this.googleUserMap = { ...newGoogleUserMap, ...this.googleUserMap };
              localStorage.setItem('reading_users_db', JSON.stringify(this.usersDb));
              localStorage.setItem('reading_google_users', JSON.stringify(this.googleUserMap));

              if (this.nickname && (!this.selectedBookTitle || !this.getUserBooks(this.nickname).includes(this.selectedBookTitle))) {
                const books = this.getUserBooks(this.nickname);
                if (books.length > 0) {
                  this.selectedBookTitle = books[0];
                }
              }
            }
          } catch (err) {
            console.log('GAS fetch notice:', err);
          }
        }
      };
    }
  </script>
